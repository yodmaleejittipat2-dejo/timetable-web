<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ตารางเรียน</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ตารางเรียน">
<meta name="theme-color" content="#F5F6FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D0E13" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F5F6FA; --surface: #FFFFFF; --surface2: #EEF0F6; --text: #14151C; --text2: #6B7080;
  --line: #E4E6EE; --accent: #5B4CF0; --accent-soft: #ECEAFE; --hero1: #2B2780; --hero2: #7C3AED;
  --danger: #E5484D; --danger-soft: #FDECEC;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0D0E13; --surface: #181A22; --surface2: #22252F; --text: #F2F3F7; --text2: #9A9FB0;
    --line: #2A2D38; --accent: #8C7FFF; --accent-soft: #262248; --hero1: #231F6B; --hero2: #5E2BB8;
    --danger: #FF6B6F; --danger-soft: #3A1C20;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font-family: "IBM Plex Sans Thai", -apple-system, "Sukhumvit Set", "Thonburi", system-ui, sans-serif;
  font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased;
  padding: calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 28px);
  max-width: 640px; margin: 0 auto; overscroll-behavior-y: none;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
.row { display: flex; align-items: center; gap: 10px; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--text2); }
.small { font-size: 12px; }
.b { font-weight: 700; }
.ellipsis { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.top { margin: 8px 4px 16px; }
.title { font-size: 28px; font-weight: 700; line-height: 1.2; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line);
  display: grid; place-items: center; position: relative; flex: none;
}
.icon-btn svg { width: 22px; height: 22px; stroke: var(--text); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.dot { position: absolute; top: 0; right: 0; width: 12px; height: 12px; border-radius: 50%; background: var(--danger); border: 2px solid var(--bg); }
.hero {
  background: linear-gradient(135deg, var(--hero1), var(--hero2)); color: #fff; border-radius: 26px;
  padding: 18px 20px 20px; cursor: pointer;
}
.hero .soft { color: rgba(255,255,255,.8); }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 10px 4px; border-radius: 99px; }
.hero .pill { background: rgba(255,255,255,.19); color: #fff; margin-top: 12px; }
.hero h2 { margin: 8px 0 0; font-size: 26px; line-height: 1.25; }
.bar { height: 6px; border-radius: 99px; background: rgba(255,255,255,.22); margin-top: 14px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: #fff; border-radius: 99px; }
.status { margin-top: 10px; border-radius: 14px; padding: 10px 14px; background: var(--surface2); color: var(--text2); font-size: 13px; cursor: pointer; }
.status.warn { background: var(--danger-soft); color: var(--danger); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
.section { font-size: 13px; font-weight: 700; color: var(--text2); margin: 22px 4px 10px; }
.chips { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 18px 0 6px; }
.chip { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 9px 0 10px; text-align: center; }
.chip.today { border: 2px solid var(--accent); }
.chip.sel { background: var(--accent); color: #fff; border-color: var(--accent); }
.chip .d { font-weight: 700; font-size: 15px; }
.chip .n { font-size: 12px; color: var(--text2); }
.chip.sel .n { color: rgba(255,255,255,.85); }
.chip .n.off { color: var(--danger); }
.chip.sel .n.off { color: #fff; }
.list-head { margin: 14px 4px 10px; }
.cls { display: flex; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 14px 14px 14px 16px; margin-bottom: 10px; cursor: pointer; width: 100%; text-align: left; }
.cls.now { border: 2px solid var(--accent); }
.cls.past { opacity: .5; }
.time { width: 58px; flex: none; }
.time .s { font-weight: 700; }
.time .e { font-size: 12px; color: var(--text2); }
.vbar { width: 4px; height: 46px; border-radius: 99px; margin-right: 14px; flex: none; }
.lunch { display: flex; align-items: center; border: 1px dashed var(--line); border-radius: 16px; padding: 10px 16px; margin-bottom: 10px; color: var(--text2); }
.banner { background: var(--danger-soft); border-radius: 16px; padding: 12px 16px; margin-bottom: 10px; }
.banner .b { color: var(--danger); }
.accent-pill { background: var(--accent); color: #fff; }
.soft-pill { background: var(--accent-soft); color: var(--accent); }
.red-pill { background: var(--danger); color: #fff; }
.center { text-align: center; }
.fade { animation: fade .22s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* สไลด์กิจกรรม */
.slider { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; gap: 12px; border-radius: 22px; }
.slider::-webkit-scrollbar { display: none; }
.slide { flex: 0 0 100%; scroll-snap-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; cursor: pointer; }
.media { position: relative; overflow: hidden; background: var(--surface2); display: flex; justify-content: center; align-items: center; }
.media .blur { position: absolute; inset: -30px; background-size: cover; background-position: center; filter: blur(22px); opacity: .95; }
.media .shade { position: absolute; inset: 0; background: rgba(0,0,0,.16); }
.media img { position: relative; display: block; width: 100%; height: auto; object-fit: contain; }
.media .play { position: absolute; width: 64px; height: 64px; border-radius: 50%; background: rgba(0,0,0,.6); display: grid; place-items: center; }
.media .play svg { width: 26px; height: 26px; fill: #fff; margin-left: 4px; }
.textpost { background: linear-gradient(135deg, var(--hero1), var(--hero2)); color: #fff; font-size: 19px; font-weight: 700; padding: 22px 20px; min-height: 150px; display: flex; align-items: center; white-space: pre-wrap; }
.cap { padding: 12px 16px 14px; }
.dots { display: flex; justify-content: center; gap: 6px; margin-top: 10px; }
.dots i { width: 7px; height: 7px; border-radius: 99px; background: var(--line); transition: width .2s; }
.dots i.on { width: 18px; background: var(--accent); }

/* หน้าย่อย */
.sub-top { margin: 8px 0 16px; }
.sub-top .t { font-size: 18px; font-weight: 700; }
.subject-head { border-radius: 26px; padding: 20px 20px 22px; color: #fff; }
.subject-head .pill { background: rgba(255,255,255,.22); color: #fff; }
.subject-head h2 { margin: 10px 0 0; font-size: 26px; line-height: 1.25; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 12px 16px 14px; }
.tile .v { font-weight: 700; font-size: 17px; margin-top: 2px; }
.lrow { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }
.lrow:last-child { border-bottom: 0; }
.lrow .val { color: var(--accent); font-weight: 700; font-size: 14px; }
.lrow .val.warn { color: var(--danger); }
textarea, select {
  width: 100%; font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line);
  border-radius: 20px; padding: 14px 16px; outline: none;
}
textarea { min-height: 120px; resize: vertical; }
select { appearance: none; -webkit-appearance: none; border-radius: 14px; padding: 8px 12px; width: auto; color: var(--accent); font-weight: 700; }
.switch { position: relative; width: 50px; height: 30px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch span { position: absolute; inset: 0; background: var(--line); border-radius: 99px; transition: .2s; }
.switch span::after { content: ""; position: absolute; width: 26px; height: 26px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(20px); }
.btn { display: block; width: 100%; text-align: center; font-weight: 700; padding: 14px; border-radius: 18px; background: var(--accent); color: #fff; }
.btn.soft { background: var(--accent-soft); color: var(--accent); }
.post { margin-bottom: 12px; }
.post .head { padding: 14px 16px 4px; }
.post .body { padding: 0 16px 14px; white-space: pre-wrap; }

/* ดูรูป/วิดีโอเต็มจอ */
.viewer { position: fixed; inset: 0; background: #000; z-index: 50; display: flex; align-items: center; justify-content: center; }
.viewer img, .viewer video { max-width: 100%; max-height: 100%; }
.viewer .close { position: absolute; top: calc(env(safe-area-inset-top) + 12px); left: 16px; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,.18); color: #fff; font-size: 22px; }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 24px); transform: translateX(-50%); background: #222; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 60; max-width: 90%; }
.steps { padding: 6px 16px 14px; margin: 0; }
.steps li { margin: 6px 0; }
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
